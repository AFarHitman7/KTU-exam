<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAF9F6">
  <meta name="description" content="A quiet, personal exam planner for KTU. Courses, timetable, calendar, progress and GitHub sync — all in your browser.">
  <meta name="robots" content="noindex, nofollow">
  <title>KTU Exam — a quiet exam planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23FAF9F6'/%3E%3Crect x='7' y='24' width='24' height='24' rx='5' fill='%23C6E6F5' stroke='%231A1A1A' stroke-width='2.5'/%3E%3Crect x='33' y='24' width='24' height='24' rx='5' fill='%23FFF0B8' stroke='%231A1A1A' stroke-width='2.5'/%3E%3Crect x='20' y='10' width='24' height='24' rx='5' fill='%23FBD3E0' stroke='%231A1A1A' stroke-width='2.5'/%3E%3Cpath d='M26 22l4 4 8-9' fill='none' stroke='%231A1A1A' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body data-view="home">
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="app">
    <aside class="sidebar" aria-label="Main navigation">
      <button class="brand" type="button" data-nav="home">
        <span class="brand-seal" aria-hidden="true">
          <span class="seal-note seal-note--mizu"></span>
          <span class="seal-note seal-note--lemon"></span>
          <span class="seal-note seal-note--sakura"><span class="seal-check"></span></span>
        </span>
        <span class="brand-text">
          <strong>Exam Plan</strong>
          <small>KTU · study planner</small>
        </span>
      </button>

      <nav class="side-nav">
        <button class="nav-item" type="button" data-nav="home">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20H4z"/><path d="M9.5 20v-6h5v6"/></svg>
          <span>Home</span>
        </button>
        <button class="nav-item" type="button" data-nav="calendar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16"/><path d="M3 10h18M8 2v6M16 2v6"/></svg>
          <span>Calendar</span>
        </button>
        <button class="nav-item" type="button" data-nav="today">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span>Today</span>
        </button>
        <button class="nav-item" type="button" data-nav="timetable">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18"/><path d="M3 9h18M9 3v18"/></svg>
          <span>Timetable</span>
        </button>
        <button class="nav-item" type="button" data-nav="courses">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v18H6.5A2.5 2.5 0 0 0 4 23z" transform="translate(0 -1)"/><path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20"/></svg>
          <span>Courses</span>
        </button>
        <button class="nav-item" type="button" data-nav="more">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
          <span>More</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="save-state" id="save-state" title="Data is saved in this browser">
          <span class="dot" aria-hidden="true"></span>
          <span class="save-text">Ready</span>
        </div>
        <p class="side-date" id="side-date">—</p>
      </div>
    </aside>

    <div class="main-wrap">
      <header class="mobile-top">
        <button class="brand brand--compact" type="button" data-nav="home">
          <span class="brand-seal" aria-hidden="true">
            <span class="seal-note seal-note--mizu"></span>
            <span class="seal-note seal-note--lemon"></span>
            <span class="seal-note seal-note--sakura"><span class="seal-check"></span></span>
          </span>
          <span class="brand-text">
            <strong>Exam Plan</strong>
            <small>KTU · study planner</small>
          </span>
        </button>
        <span class="save-state save-state--compact" id="save-state-mobile">
          <span class="dot" aria-hidden="true"></span>
          <span class="save-text">Ready</span>
        </span>
      </header>

      <main class="main" id="main" tabindex="-1">
        <section class="view" data-view="home" id="view-home" aria-labelledby="view-home-title"></section>
        <section class="view" data-view="calendar" id="view-calendar" aria-labelledby="view-calendar-title"></section>
        <section class="view" data-view="today" id="view-today" aria-labelledby="view-today-title"></section>
        <section class="view" data-view="timetable" id="view-timetable" aria-labelledby="view-timetable-title"></section>
        <section class="view" data-view="courses" id="view-courses" aria-labelledby="view-courses-title"></section>
        <section class="view" data-view="more" id="view-more" aria-labelledby="view-more-title"></section>
      </main>
    </div>

    <nav class="tabbar" aria-label="Primary navigation">
      <button class="tab" type="button" data-nav="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20H4z"/><path d="M9.5 20v-6h5v6"/></svg>
        <span>Home</span>
      </button>
      <button class="tab" type="button" data-nav="calendar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16"/><path d="M3 10h18M8 2v6M16 2v6"/></svg>
        <span>Calendar</span>
      </button>
      <button class="tab" type="button" data-nav="today">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span>Today</span>
      </button>
      <button class="tab" type="button" data-nav="timetable">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18"/><path d="M3 9h18M9 3v18"/></svg>
        <span>Timetable</span>
      </button>
      <button class="tab" type="button" data-nav="courses">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 0 4 24z" transform="translate(0 -1)"/><path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20"/></svg>
        <span>Courses</span>
      </button>
      <button class="tab" type="button" data-nav="more">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        <span>More</span>
      </button>
    </nav>
  </div>

  <dialog id="modal" class="modal" aria-labelledby="modal-title"></dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <script src="app.js" defer></script>
</body>
</html>
